name: Compass Therapeutics
description: 'Compass Therapeutics is a clinical-stage biopharmaceutical company developing proprietary
  antibody-based therapeutics for the treatment of cancer. Its research is grounded in understanding the
  tumor microenvironment, designing candidates that optimize the components required for an effective
  anti-tumor immune response and bridge innate and adaptive immunity. Lead clinical programs include
  tovecimig and CTX-8371. Surfaced as a portfolio company of GV, this is a life-sciences company profile
  in the API Evangelist network; it publishes a corporate and investor web presence but no public
  developer, API, or technical integration surface.'
